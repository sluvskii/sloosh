name: Android Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official public Release (not draft)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " /tmp/build.log | head -60 | sed 's/^/::error::/'
          exit $status

      - name: Package & Prepare APK
        id: package
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release!"
            exit 1
          fi
          OUTPUT_NAME="sloosh-v2.0.${{ github.run_number }}.apk"
          cp "$APK_FILE" "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT
          echo "### 📱 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`2.0.${{ github.run_number }}\` (Build #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`$OUTPUT_NAME\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
            echo "- **Release Status**: 🚀 Official Public Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release Status**: 🔒 Draft (Visible only to you on GitHub)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloosh-android-v2.0.${{ github.run_number }}
          path: ${{ steps.package.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: sloosh Android v2.0.${{ github.run_number }}
          body: |
            Android release build **2.0.${{ github.run_number }}** (commit `${{ github.sha }}`).

            ### Установка:
            Скачайте прикреплённый файл `.apk` и установите на устройство Android.
          files: ${{ steps.package.outputs.apk_path }}
          draft: ${{ github.event.inputs.publish_release != 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
