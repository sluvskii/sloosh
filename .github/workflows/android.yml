name: Android Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official public Release (not draft)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLOOSH_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SLOOSH_KEYSTORE_PASSWORD || secrets.SLOOSH_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.SLOOSH_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          echo "### 🔑 Keystore Decode Summary" >> $GITHUB_STEP_SUMMARY
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
            cp release.keystore app/release.keystore
            SIZE=$(wc -c < release.keystore)
            echo "- Keystore decoded: $SIZE bytes" >> $GITHUB_STEP_SUMMARY
            echo "- Certificate info:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            keytool -list -v -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name|SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **Warning**: SLOOSH_KEYSTORE_BASE64 is empty or not set in Repository Secrets!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
          SLOOSH_STORE_FILE: ${{ hashFiles('release.keystore') != '' && 'release.keystore' || '' }}
          SLOOSH_STORE_PASSWORD: ${{ secrets.SLOOSH_KEYSTORE_PASSWORD || secrets.SLOOSH_STORE_PASSWORD || 'android' }}
          SLOOSH_KEY_ALIAS: ${{ secrets.SLOOSH_KEY_ALIAS || 'androiddebugkey' }}
          SLOOSH_KEY_PASSWORD: ${{ secrets.SLOOSH_KEY_PASSWORD || secrets.SLOOSH_KEYSTORE_PASSWORD || secrets.SLOOSH_STORE_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-run-${{ github.run_number }}
          path: gradle-build.log
          retention-days: 7

      - name: Package & Prepare APK
        id: package
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release!"
            exit 1
          fi
          OUTPUT_NAME="sloosh-v2.0.${{ github.run_number }}.apk"
          cp "$APK_FILE" "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT
          echo "### 📱 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`2.0.${{ github.run_number }}\` (Build #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`$OUTPUT_NAME\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
            echo "- **Release Status**: 🚀 Official Public Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release Status**: 🔒 Draft (Visible only to you on GitHub)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloosh-android-v2.0.${{ github.run_number }}
          path: ${{ steps.package.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: sloosh Android v2.0.${{ github.run_number }}
          body: |
            Android release build **2.0.${{ github.run_number }}** (commit `${{ github.sha }}`).

            ### Установка:
            Скачайте прикреплённый файл `.apk` и установите на устройство Android.
          files: ${{ steps.package.outputs.apk_path }}
          draft: ${{ github.event.inputs.publish_release != 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
